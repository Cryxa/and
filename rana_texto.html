
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    .contenedor {
      max-width: 450px;
      margin: 0 auto;
    }

    .audio-box {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 2px 8px #00000015;
    }

    .audio-box h2 {
      font-size: 20px;
      margin-top: 0;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <h1>La ranita rita</h1>

  <div class="contenedor">

    <div class="audio-box">
      <h2>Lectura</h2>
      <audio controls preload="none">
        <source src="ranarita.mp3" type="audio/mpeg">
        Tu navegador no admite audio HTML.
      </audio>
    </div>

    <div class="audio-box">
      <h2>Pregunta 1</h2>
      <audio controls preload="none">
        <source src="rana_p1.mp3" type="audio/mpeg">
        Tu navegador no admite audio HTML.
      </audio>
    </div>

    <div class="audio-box">
      <h2>Pregunta 2</h2>
      <audio controls preload="none">
        <source src="rana_p2.mp3" type="audio/mpeg">
        Tu navegador no admite audio HTML.
      </audio>
    </div>

    <div class="audio-box">
      <h2>Pregunta 3</h2>

    </div>

  </div>

</body>
</html>
